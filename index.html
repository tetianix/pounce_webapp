<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pounce</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f4f1f3);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);

    /* Pounce bubblegum */
    --accent: #F06292;
    --on-accent: #ffffff;
    --accent-soft: rgba(240, 98, 146, 0.14);
    --accent-line: rgba(240, 98, 146, 0.45);
  }
  :root[data-scheme="dark"] {
    --accent: #F48FB1;
    --on-accent: #2a0f19;
    --accent-soft: rgba(244, 143, 177, 0.16);
    --accent-line: rgba(244, 143, 177, 0.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    padding: 12px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* Header */
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 0 18px;
  }
  .logo {
    width: 44px; height: 44px; flex: none;
    display: block; object-fit: cover;
    border-radius: 14px;
    background: var(--accent);
    box-shadow: 0 6px 16px -6px var(--accent-line);
  }
  .brand h1 { margin: 0; font-size: 24px; font-weight: 750; letter-spacing: -0.02em; }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--hint); }

  /* Sections */
  .section { margin-top: 20px; }
  .label {
    display: block; margin: 0 4px 8px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--hint);
  }

  .field {
    width: 100%; padding: 14px 16px;
    font: inherit; font-size: 17px; color: var(--text);
    background: var(--card);
    border: 1.5px solid transparent; border-radius: 14px;
    outline: none; appearance: none; -webkit-appearance: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field::placeholder { color: var(--hint); opacity: .8; }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field.invalid { border-color: var(--danger); }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .select { position: relative; }
  .select .field { padding-right: 44px; cursor: pointer; }
  .select::after {
    content: ""; position: absolute; right: 20px; top: 50%;
    width: 8px; height: 8px; pointer-events: none;
    border-right: 2px solid var(--hint); border-bottom: 2px solid var(--hint);
    transform: translateY(-70%) rotate(45deg);
  }

  .price { display: flex; align-items: center; gap: 8px; }
  .price .dash { color: var(--hint); }
  .price .field { flex: 1; min-width: 0; }

  .hint {
    display: none; margin: 8px 4px 0;
    font-size: 13px; color: var(--danger);
  }
  .hint.show { display: block; }

  /* Quick price chips */
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .chip {
    min-width: 0; padding: 9px 2px; border-radius: 999px;
    font-size: 14px; font-weight: 500; white-space: nowrap;
    background: var(--card); border: 0;
    transition: background .15s, color .15s, box-shadow .15s, transform .1s;
  }
  .chip:active { transform: scale(.96); }
  .chip.active {
    background: var(--accent); color: var(--on-accent);
    box-shadow: 0 4px 12px -4px var(--accent-line);
  }
  .section.disabled .chips { opacity: .4; pointer-events: none; }
  @media (max-width: 340px) { .chip { padding-inline: 0; font-size: 12.5px; } }

  /* Segmented control */
  .segmented {
    position: relative; display: grid; grid-template-columns: repeat(3, 1fr);
    padding: 4px; border-radius: 14px; background: var(--card);
  }
  .segmented .thumb {
    position: absolute; top: 4px; bottom: 4px; left: 4px;
    width: calc((100% - 8px) / 3);
    border-radius: 10px; background: var(--accent);
    box-shadow: 0 4px 12px -4px var(--accent-line);
    transition: transform .25s cubic-bezier(.3, .7, .4, 1);
  }
  .segmented button {
    position: relative; z-index: 1;
    padding: 10px 4px; border: 0; background: none;
    font-size: 15px; font-weight: 600; color: var(--text);
    transition: color .2s;
  }
  .segmented button.active { color: var(--on-accent); }

  /* Toggle */
  .switch-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border-radius: 14px; background: var(--card);
    cursor: pointer;
  }
  .switch-row .txt { flex: 1; }
  .switch-row .txt b { display: block; font-weight: 600; }
  .switch-row .txt small { display: block; margin-top: 2px; font-size: 13px; color: var(--hint); }
  .switch-row.compact { margin-top: 10px; padding-block: 11px; }

  .switch { position: relative; width: 51px; height: 31px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .watch-note {
    display: none; margin: 8px 4px 0;
    font-size: 13px; color: var(--hint);
  }
  .watch-note.show { display: block; }

  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: color-mix(in srgb, var(--hint) 35%, transparent);
    transition: background .2s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25);
    transition: transform .22s cubic-bezier(.3, .7, .4, 1);
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent-soft); }

</style>
</head>
<body>
  <header class="brand">
    <img class="logo" src="logo.png" alt="" width="44" height="44">
    <div>
      <h1>Pounce<span>.</span></h1>
      <p>Полюю на оголошення OLX за тебе</p>
    </div>
  </header>

  <div class="section">
    <label class="label" for="query">Що шукаємо?</label>
    <input id="query" class="field" type="text" placeholder="Напр. помада dior" autocomplete="off" enterkeyhint="done">
    <label class="switch-row compact">
      <span class="txt">
        <b>Тільки точний збіг у назві</b>
        <small>Усі слова запиту мають бути в назві</small>
      </span>
      <span class="switch">
        <input id="exact" type="checkbox" role="switch">
        <span class="track"></span>
      </span>
    </label>
  </div>

  <div class="section">
    <span class="label">Ціна, грн</span>
    <div class="price">
      <input id="min" class="field" type="number" inputmode="numeric" min="0" placeholder="від" aria-label="Ціна від">
      <span class="dash">—</span>
      <input id="max" class="field" type="number" inputmode="numeric" min="0" placeholder="до" aria-label="Ціна до">
    </div>
    <div class="hint" id="priceHint" role="alert">«Від» не може бути більше, ніж «до» 🙀</div>
    <div class="chips" id="presets">
      <button class="chip" type="button" data-min="" data-max="300">до 300</button>
      <button class="chip" type="button" data-min="300" data-max="700">300–700</button>
      <button class="chip" type="button" data-min="700" data-max="1500">700–1.5к</button>
      <button class="chip" type="button" data-min="1500" data-max="">від 1.5к</button>
    </div>
  </div>

  <div class="section">
    <label class="label" for="city">Місто</label>
    <div class="select">
      <select id="city" class="field">
        <option value="">Вся Україна</option>
        <option value="kyiv">Київ</option>
        <option value="kharkiv">Харків</option>
        <option value="odesa">Одеса</option>
        <option value="dnipro">Дніпро</option>
        <option value="lviv">Львів</option>
        <option value="zaporizhzhia">Запоріжжя</option>
        <option value="vinnytsia">Вінниця</option>
        <option value="zhytomyr">Житомир</option>
        <option value="ivano-frankivsk">Івано-Франківськ</option>
        <option value="kropyvnytskyi">Кропивницький</option>
        <option value="lutsk">Луцьк</option>
        <option value="mykolaiv">Миколаїв</option>
        <option value="poltava">Полтава</option>
        <option value="rivne">Рівне</option>
        <option value="sumy">Суми</option>
        <option value="ternopil">Тернопіль</option>
        <option value="uzhhorod">Ужгород</option>
        <option value="kherson">Херсон</option>
        <option value="khmelnytskyi">Хмельницький</option>
        <option value="cherkasy">Черкаси</option>
        <option value="chernivtsi">Чернівці</option>
        <option value="chernihiv">Чернігів</option>
      </select>
    </div>
  </div>

  <div class="section">
    <span class="label">Стан</span>
    <div class="segmented" id="state" role="radiogroup">
      <div class="thumb" aria-hidden="true"></div>
      <button type="button" role="radio" class="active" aria-checked="true" data-value="any">Будь-який</button>
      <button type="button" role="radio" aria-checked="false" data-value="new">Нове</button>
      <button type="button" role="radio" aria-checked="false" data-value="used">Вживане</button>
    </div>
  </div>

  <div class="section">
    <span class="label">Сортування</span>
    <div class="segmented" id="sort" role="radiogroup">
      <div class="thumb" aria-hidden="true"></div>
      <button type="button" role="radio" class="active" aria-checked="true" data-value="new">Нові</button>
      <button type="button" role="radio" aria-checked="false" data-value="cheap">Дешевші</button>
      <button type="button" role="radio" aria-checked="false" data-value="expensive">Дорожчі</button>
    </div>
  </div>

  <div class="section" id="periodSection">
    <span class="label">Період</span>
    <div class="chips" id="period" role="radiogroup">
      <button class="chip active" type="button" role="radio" aria-checked="true" data-period="any">Будь-коли</button>
      <button class="chip" type="button" role="radio" aria-checked="false" data-period="1d">Сьогодні</button>
      <button class="chip" type="button" role="radio" aria-checked="false" data-period="3d">3 дні</button>
      <button class="chip" type="button" role="radio" aria-checked="false" data-period="7d">Тиждень</button>
    </div>
  </div>

  <div class="section">
    <label class="switch-row">
      <span class="txt">
        <b>Стежити за пошуком</b>
        <small>Напишу, щойно з'явиться нове або подешевшає</small>
      </span>
      <span class="switch">
        <input id="watch" type="checkbox" role="switch">
        <span class="track"></span>
      </span>
    </label>
    <div class="watch-note" id="watchNote">Для стеження період не враховується</div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  const root = document.documentElement;
  const $ = id => document.getElementById(id);

  const ACCENT = {
    light: { color: "#F06292", text: "#ffffff" },
    dark:  { color: "#F48FB1", text: "#2a0f19" }
  };
  const MUTED = {
    light: { color: "#e5e5ea", text: "#8e8e93" },
    dark:  { color: "#3a3a3c", text: "#8e8e93" }
  };
  const STORAGE_KEY = "pounce_form";

  function haptic(kind, style) {
    const h = tg.HapticFeedback;
    if (!h || !tg.isVersionAtLeast("6.1")) return;
    if (kind === "impact") h.impactOccurred(style || "light");
    else if (kind === "select") h.selectionChanged();
    else if (kind === "notify") h.notificationOccurred(style);
  }

  function applyTheme() {
    const scheme = tg.colorScheme === "dark" ? "dark" : "light";
    root.dataset.scheme = scheme;
    const bg = tg.themeParams.bg_color || (scheme === "dark" ? "#1c1c1e" : "#ffffff");
    if (tg.isVersionAtLeast("6.1")) {
      tg.setHeaderColor(bg);
      tg.setBackgroundColor(bg);
    }
    if (tg.isVersionAtLeast("7.10") && tg.setBottomBarColor) {
      tg.setBottomBarColor(bg);
    }
    updateMainButton();
  }

  function updateMainButton() {
    const scheme = root.dataset.scheme === "dark" ? "dark" : "light";
    const active = $("query").value.trim() !== "";
    const colors = active ? ACCENT[scheme] : MUTED[scheme];
    tg.MainButton.setParams({ color: colors.color, text_color: colors.text, is_active: active });
  }

  /* ---------- Price ---------- */
  const minEl = $("min"), maxEl = $("max"), hintEl = $("priceHint");
  const presets = document.querySelectorAll("#presets .chip");

  function syncPresets() {
    presets.forEach(c => c.classList.toggle("active",
      c.dataset.min === minEl.value && c.dataset.max === maxEl.value));
  }

  function validatePrice() {
    const bad = minEl.value !== "" && maxEl.value !== "" && Number(minEl.value) > Number(maxEl.value);
    hintEl.classList.toggle("show", bad);
    minEl.classList.toggle("invalid", bad);
    maxEl.classList.toggle("invalid", bad);
    return !bad;
  }

  [minEl, maxEl].forEach(el => el.addEventListener("input", () => {
    validatePrice();
    syncPresets();
    saveForm();
  }));

  presets.forEach(chip => chip.addEventListener("click", () => {
    if (chip.classList.contains("active")) {
      minEl.value = ""; maxEl.value = "";
    } else {
      minEl.value = chip.dataset.min; maxEl.value = chip.dataset.max;
    }
    haptic("impact", "light");
    validatePrice();
    syncPresets();
    saveForm();
  }));

  /* ---------- Segmented: sort, state ---------- */
  function makeSegmented(el) {
    const btns = [...el.querySelectorAll("button")];
    const thumb = el.querySelector(".thumb");
    const control = {
      value: btns.find(b => b.classList.contains("active")).dataset.value,
      has: value => btns.some(b => b.dataset.value === value),
      set(value) {
        btns.forEach((b, i) => {
          const on = b.dataset.value === value;
          b.classList.toggle("active", on);
          b.setAttribute("aria-checked", on ? "true" : "false");
          if (on) thumb.style.transform = `translateX(${i * 100}%)`;
        });
        control.value = value;
      }
    };
    btns.forEach(btn => btn.addEventListener("click", () => {
      if (btn.dataset.value === control.value) return;
      control.set(btn.dataset.value);
      haptic("select");
      saveForm();
    }));
    return control;
  }
  const sortControl = makeSegmented($("sort"));
  const stateControl = makeSegmented($("state"));
  const thumbs = document.querySelectorAll(".segmented .thumb");

  /* ---------- City, exact ---------- */
  const cityEl = $("city");
  cityEl.addEventListener("change", () => {
    haptic("select");
    saveForm();
  });
  $("exact").addEventListener("change", e => {
    haptic("impact", e.target.checked ? "medium" : "light");
    saveForm();
  });

  /* ---------- Period ---------- */
  let period = "any";
  const periodBtns = document.querySelectorAll("#period .chip");
  function setPeriod(value) {
    periodBtns.forEach(b => {
      const on = b.dataset.period === value;
      b.classList.toggle("active", on);
      b.setAttribute("aria-checked", on ? "true" : "false");
    });
    period = value;
  }
  periodBtns.forEach(btn => btn.addEventListener("click", () => {
    if (btn.dataset.period === period) return;
    setPeriod(btn.dataset.period);
    haptic("select");
    saveForm();
  }));

  /* ---------- Watch ---------- */
  function syncWatch() {
    const on = $("watch").checked;
    $("periodSection").classList.toggle("disabled", on);
    periodBtns.forEach(b => { b.disabled = on; });
    $("watchNote").classList.toggle("show", on);
  }
  $("watch").addEventListener("change", e => {
    haptic("impact", e.target.checked ? "medium" : "light");
    syncWatch();
  });

  /* ---------- Storage ---------- */
  function saveForm() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        query: $("query").value, min: minEl.value, max: maxEl.value, sort: sortControl.value, period: period,
        city: cityEl.value, state: stateControl.value, exact: $("exact").checked
      }));
    } catch (_) {}
  }

  function loadForm() {
    let data;
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (_) { return; }
    if (!data || typeof data !== "object") return;
    const isPrice = v => typeof v === "string" && /^\d*$/.test(v);
    if (typeof data.query === "string") $("query").value = data.query;
    if (isPrice(data.min)) minEl.value = data.min;
    if (isPrice(data.max)) maxEl.value = data.max;
    if (sortControl.has(data.sort)) sortControl.set(data.sort);
    if ([...periodBtns].some(b => b.dataset.period === data.period)) setPeriod(data.period);
    if ([...cityEl.options].some(o => o.value === data.city)) cityEl.value = data.city;
    if (stateControl.has(data.state)) stateControl.set(data.state);
    if (typeof data.exact === "boolean") $("exact").checked = data.exact;
  }

  /* ---------- Submit ---------- */
  function submit() {
    const query = $("query").value.trim();
    if (!query) {
      haptic("notify", "error");
      $("query").focus();
      try { tg.showAlert("Напиши, що шукаємо"); } catch (_) { alert("Напиши, що шукаємо"); }
      return;
    }
    if (!validatePrice()) {
      haptic("notify", "error");
      return;
    }
    const min = minEl.value;
    const max = maxEl.value;
    const payload = JSON.stringify({
      query: query,
      min_price: min ? Number(min) : null,
      max_price: max ? Number(max) : null,
      sort: sortControl.value,
      period: period,
      city: cityEl.value || null,
      state: stateControl.value === "any" ? null : stateControl.value,
      exact: $("exact").checked,
      watch: $("watch").checked
    });
    haptic("notify", "success");
    tg.sendData(payload);
  }

  $("query").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
  $("query").addEventListener("input", () => {
    updateMainButton();
    saveForm();
  });

  thumbs.forEach(t => { t.style.transition = "none"; });
  loadForm();
  validatePrice();
  syncPresets();
  syncWatch();
  requestAnimationFrame(() => { thumbs.forEach(t => { t.style.transition = ""; }); });

  tg.ready();
  tg.expand();
  applyTheme();
  tg.onEvent("themeChanged", applyTheme);

  tg.MainButton.setText("Знайти 🐾");
  tg.MainButton.show();
  tg.MainButton.onClick(submit);

</script>
</body>
</html>
